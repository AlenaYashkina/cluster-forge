name: Filesystem safety tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  safety:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m compileall -q backend
      - run: python -m pytest -q tests/test_safe_cluster_names.py tests/test_undo_safety.py
