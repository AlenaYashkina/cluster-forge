name: Backend installation and frontend build
on:
  pull_request:
  push:
    branches: [main]
jobs:
  backend-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pip check
      - name: Import backend and verify FastAPI routes
        run: |
          python -c "from backend.api import app; from backend import cluster_core; assert app.title; assert cluster_core.CLIP_AVAILABLE; print('Backend + CLIP imports passed')"
  frontend-build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
