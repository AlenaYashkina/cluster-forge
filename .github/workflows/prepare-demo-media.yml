name: Prepare lightweight demo media
on:
  pull_request:
    paths:
      - .github/workflows/prepare-demo-media.yml
      - assets/cluster-preview.gif
jobs:
  optimize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Convert existing GIF to lightweight real previews
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg gifsicle
          ffmpeg -hide_banner -loglevel error -y -i assets/cluster-preview.gif -frames:v 1 -vf scale=960:-2 assets/cluster-poster.png
          ffmpeg -hide_banner -loglevel error -y -i assets/cluster-preview.gif -vf fps=12,scale=960:-2 -c:v libx264 -crf 28 -pix_fmt yuv420p -movflags +faststart assets/cluster-preview.mp4
          gifsicle --colors 96 -O3 --lossy=35 assets/cluster-preview.gif -o assets/cluster-preview-small.gif
          echo "Original size: $(wc -c < assets/cluster-preview.gif)"
          echo "Optimized size: $(wc -c < assets/cluster-preview-small.gif)"
          test -s assets/cluster-poster.png
          test -s assets/cluster-preview.mp4
          test -s assets/cluster-preview-small.gif
          test "$(wc -c < assets/cluster-preview-small.gif)" -lt "$(wc -c < assets/cluster-preview.gif)"
      - name: Commit generated media to the PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cluster-poster.png assets/cluster-preview.mp4 assets/cluster-preview-small.gif
          if ! git diff --cached --quiet; then
            git commit -m "docs: generate optimized authentic Cluster Forge preview media"
            git push
          fi
